[package]
name = "ashiato-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ashiato-build-stamp = { path = "../build-stamp" }
ashiato-update-check = { path = "../update-check" }
ashiato-winsvc = { path = "../winsvc" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }

[build-dependencies]
ashiato-build-stamp = { path = "../build-stamp" }

[dev-dependencies]
tempfile = "3"
