[package]
name = "ashiato-collector-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 取り込み口へ送るだけ。**TLS の機能を入れない**（design D16）——
# S-01 / C-02 はどちらもオンプレ（要件 §5 技術的制約 ★2026-09-12）で、
# 依存を増やすほど許諾の検査（tools/check-licenses.sh）の面が広がる。
ureq = { version = "3", default-features = false }
# 記録に載せる IANA のタイムゾーン識別子（FR-20）。chrono は名前を持たない。
iana-time-zone = "0.1"

# Windows の実機でしか動かない部分。**unsafe を書かずに安全な wrapper に委ねる**
# （design D15）—— 作業場の lint は `unsafe_code = "forbid"` で、これは
# ワークスペース全体の保証なので崩さない。
[target.'cfg(windows)'.dependencies]
# 前景ウィンドウの題名・アプリ名・実行ファイルのパス・プロセス識別子
active-win-pos-rs = "0.9"
# 最後の入力からの経過時間（FR-81 / design D9）
user-idle-time = "0.7"
# アドレスバーの読み取りと、前景が変わったことの OS からの通知（design D4 / D5）
uiautomation = { version = "0.25", features = ["event"] }
# OS が最後に起動した時刻（design D23）。「PC を閉じていた」と「収集だけが止まっていた」を
# 記録から分けるため。**機能を `system` だけに絞る**（既定の全機能は windows crate の
# 巨大な機能集合を引き、手元でコンパイルが OOM した）
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# 窓を閉じられた・Ctrl-C で止められたときに、手元の数えを吐き出してから終わる（R13 / B-4）
ctrlc = { version = "3", features = ["termination"] }
