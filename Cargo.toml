[workspace]
resolver = "2"
members = ["crates/server", "crates/collector-windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# 合言葉の定数時間比較。**性質を構造で保証する** —— 早期打ち切りの回帰は
# 単体テストでは捕まえられない（review R7）ので、比較そのものを型に委ねる。
subtle = "2"
unicode-normalization = "0.1"

# 製造準備 C: フレームワーク既定に追加ルールを足す。
# docstring の方針 —— **公開する項目には「何を保証するか」を 1 行書く**。
# 「何をするか」はコードが語るので書かない。
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"      # 私的データを扱うので、落ちる経路を明示的にしか作らない
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"     # ログは tracing に一本化する（A-2: 出さないものを決めてある）
