[workspace]
resolver = "2"
members = ["crates/server", "crates/collector-windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# 合言葉の定数時間比較。**性質を構造で保証する** —— 早期打ち切りの回帰は
# 単体テストでは捕まえられない（review R7）ので、比較そのものを型に委ねる。
subtle = "2"
unicode-normalization = "0.1"

# 製造準備 C: フレームワーク既定に追加ルールを足す。
# docstring の方針 —— **公開する項目には「何を保証するか」を 1 行書く**。
# 「何をするか」はコードが語るので書かない。
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"      # 私的データを扱うので、落ちる経路を明示的にしか作らない
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"     # ログは tracing に一本化する（A-2: 出さないものを決めてある）

# 一段厳しく（2026-10-11。本人「lint を厳しく」）。pedantic を丸ごと止め、下の 2 つの表だけを許す。
pedantic = { level = "deny", priority = -1 }
# 外したまま: 他人に配るライブラリ向けの文書の催促。この repo の crate は配らない
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# **まだ直していないだけ**（main と走っている ST08・ST12・ST21 のブランチで違反があるもの）。
# 直したら行を消す。全部直すのは ST12・ST21 の merge 後に fix/ で（同じファイルを触っているので今は衝突する）
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
duration_suboptimal_units = "allow"
float_cmp = "allow"
format_push_string = "allow"
items_after_statements = "allow"
manual_assert = "allow"
manual_let_else = "allow"
manual_midpoint = "allow"
many_single_char_names = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_fields_in_debug = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
nonminimal_bool = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
stable_sort_primitive = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_self = "allow"
