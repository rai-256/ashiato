services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ashiato
      POSTGRES_USER: ashiato
      POSTGRES_DB: ashiato
    ports: ["127.0.0.1:55432:5432"]   # 全インタフェースに出さない（製造準備 C: 既定値の棚卸し）
    # プラットフォーム既定値の棚卸し（製造準備 C）。私的データを扱うので既定のままにしない。
    command: >
      postgres
      -c log_statement=none
      -c log_min_duration_statement=-1
      -c log_error_verbosity=terse
      -c max_connections=300
    # `max_connections` は既定の 100 では足りない。**試験は 1 本ごとにプールを持つ**
    # ので（`crates/server/src/testdb.rs`）、結合試験が増えたところで上限に当たり、
    # 落ちる試験が毎回変わる形で崩れた（実測）。**折りたたみブロックに `#` は書けない**
    # （そのまま postgres の引数になる）ので、注記はここに置く。
    # **TCP で問う。** 初回起動の entrypoint は初期化用の仮サーバを unix ソケットだけで立てて止める。
    # ソケットで問うとその仮サーバに healthy と答え、`up --wait` の直後の psql が
    # 「shutting down」で落ちる（実測: PR #43 の smoke）。仮サーバは TCP を開けないので TCP なら待てる。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ashiato"]
      interval: 2s
      timeout: 3s
      retries: 30
