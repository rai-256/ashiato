services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ashiato
      POSTGRES_USER: ashiato
      POSTGRES_DB: ashiato
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashiato"]
      interval: 2s
      timeout: 3s
      retries: 30
