name: vulns-nightly
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vulns:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - id: scan
        run: |
          set +e
          tools/check-vulns.sh nightly "$RUNNER_TEMP/findings"
          rc=$?
          if [ -d "$RUNNER_TEMP/findings" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"
      - if: always() && steps.scan.outputs.has == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: vulns-findings, path: "${{ runner.temp }}/findings" }

  pg-minor:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - id: scan
        run: |
          set +e
          tools/check-pg-minor.sh --findings "$RUNNER_TEMP/findings"
          rc=$?
          if [ -d "$RUNNER_TEMP/findings" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"
      - if: always() && steps.scan.outputs.has == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pg-findings, path: "${{ runner.temp }}/findings" }

  issues:
    needs: [vulns, pg-minor]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: '*-findings'
          path: "${{ runner.temp }}/findings"
          merge-multiple: true
      - if: always()
        run: |
          if [ -d "$RUNNER_TEMP/findings" ] && find "$RUNNER_TEMP/findings" -type f -print -quit | grep -q .; then
            tools/check-vulns.sh file-issues "$RUNNER_TEMP/findings"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
