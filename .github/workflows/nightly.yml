name: nightly
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - id: plan
        run: tools/release/version.sh nightly-plan | tee plan.txt && grep -E '^(build|publish|version)=' plan.txt >> "$GITHUB_OUTPUT"
  package-linux:
    needs: plan
    if: needs.plan.outputs.build == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: tools/release/build.sh server-linux "$RUNNER_TEMP/nightly"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: nightly-linux, path: "${{ runner.temp }}/nightly" }
  package-windows:
    needs: plan
    if: needs.plan.outputs.build == 'yes'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: x86_64-pc-windows-gnu }
      - run: bash tools/release/build.sh server-windows "$env:RUNNER_TEMP/nightly"
      - run: bash tools/release/build.sh collector-windows "$env:RUNNER_TEMP/nightly"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: nightly-windows, path: "${{ runner.temp }}/nightly" }
  publish:
    needs: [plan, package-linux, package-windows]
    if: needs.plan.outputs.publish == 'yes' && vars.ASHIATO_NIGHTLY_PUBLISH == 'on'
    runs-on: ubuntu-24.04
    environment:
      name: nightly
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: nightly-*, path: nightly }
      - run: mkdir -p nightly/all && find nightly/nightly-linux nightly/nightly-windows -maxdepth 1 -type f -exec cp {} nightly/all/ \;
      - run: |
          tools/release/check-artifacts.sh nightly/all --channel nightly --expect-version "${{ needs.plan.outputs.version }}"
      - run: gh release upload nightly nightly/all/* --clobber && git push --force origin "$GITHUB_SHA:refs/tags/nightly"
