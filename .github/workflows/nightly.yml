name: nightly
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - id: plan
        run: tools/release/version.sh nightly-plan | tee plan.txt && grep -E '^(build|publish|version)=' plan.txt >> "$GITHUB_OUTPUT"
        env:
          ASHIATO_NIGHTLY_PUBLISH: ${{ vars.ASHIATO_NIGHTLY_PUBLISH }}
  package-linux:
    needs: plan
    if: needs.plan.outputs.build == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with: { distribution: temurin, java-version: "21" }
      # build.sh が画面を npm ci → vite build してサーバに取り込む（web の job と同じ node の版。final review R1）
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24" }
      - run: tools/release/build.sh server-linux "$RUNNER_TEMP/nightly"
        env: { ASHIATO_BUILD_VERSION: "${{ needs.plan.outputs.version }}" }
      - run: tools/release/build.sh apk "$RUNNER_TEMP/nightly"
        env:
          ASHIATO_BUILD_VERSION: "${{ needs.plan.outputs.version }}"
          ASHIATO_APK_UNSIGNED: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: nightly-linux, path: "${{ runner.temp }}/nightly" }
  package-windows:
    needs: plan
    if: needs.plan.outputs.build == 'yes'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24" }
      # Windows の runner では build.sh が native の target で組む（gnu の target は使わない）。手順は bash で走らせる
      - run: tools/release/build.sh server-windows "$RUNNER_TEMP/nightly"
        shell: bash
        env: { ASHIATO_BUILD_VERSION: "${{ needs.plan.outputs.version }}" }
      - run: tools/release/build.sh collector-windows "$RUNNER_TEMP/nightly"
        shell: bash
        env: { ASHIATO_BUILD_VERSION: "${{ needs.plan.outputs.version }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: nightly-windows, path: "${{ runner.temp }}/nightly" }
  publish:
    needs: [plan, package-linux, package-windows]
    if: needs.plan.outputs.publish == 'yes' && vars.ASHIATO_NIGHTLY_PUBLISH == 'on'
    runs-on: ubuntu-24.04
    environment:
      name: nightly
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: nightly-*, path: nightly }
      - run: mkdir -p nightly/all && find nightly/nightly-linux nightly/nightly-windows -maxdepth 1 -type f -exec cp {} nightly/all/ \;
      - run: tools/release/publish-nightly.sh nightly/all "${{ needs.plan.outputs.version }}"
    env:
      GH_TOKEN: ${{ github.token }}
      ASHIATO_SIGNING_KEYSTORE_B64: ${{ secrets.ASHIATO_SIGNING_KEYSTORE_B64 }}
      ASHIATO_SIGNING_STORE_PASSWORD: ${{ secrets.ASHIATO_SIGNING_STORE_PASSWORD }}
      ASHIATO_SIGNING_KEY_ALIAS: ${{ secrets.ASHIATO_SIGNING_KEY_ALIAS }}
      ASHIATO_SIGNING_KEY_PASSWORD: ${{ secrets.ASHIATO_SIGNING_KEY_PASSWORD }}
      ASHIATO_EXPECT_DEV_CERT_SHA256: ${{ vars.ASHIATO_CERT_SHA256 }}
      ASHIATO_EXPECT_CERT_SHA256: ${{ vars.ASHIATO_CERT_SHA256 }}
