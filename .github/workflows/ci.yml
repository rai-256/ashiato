name: ci
on:
  push: { branches: [main] }
  pull_request:
# 二重トリガの抑止（同じ commit で push と pull_request が両方走らないよう concurrency で畳む）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read          # 権限は最小に固定する
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./tools/check-licenses.sh
      - run: ./tools/check-migrations.sh
      - run: ./tools/check-boundaries.sh
      - run: ./tools/check-openapi.sh
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24" }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: collector-android } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu ランナーには Android SDK が入っている。ローカルと同じ wrapper を使う。
      - run: ./gradlew :app:assembleDebug
      # 収集側の振る舞い（端末識別子・まとめ送り・部分失敗・ログに値を出さない）。
      # **実機なしで確かめられる範囲はここで止める** —— 実機の確認は完了の判定が持つ。
      - run: ./gradlew :app:testDebugUnitTest

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # 縦串。A で決めたもの同士が噛み合うかを見るのはこの 1 本だけ。
      - run: ./tools/smoke.sh
      - run: ./tools/check-panic-log.sh
      # 「収集した」記録が書き換えられないことを、わざと UPDATE を投げて確かめる（FR-30）
      - run: ./tools/check-immutable.sh
