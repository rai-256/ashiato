name: ci
on:
  push: { branches: [main] }
  pull_request:
# 二重トリガの抑止（同じ commit で push と pull_request が両方走らないよう concurrency で畳む）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read          # 権限は最小に固定する
jobs:
  # **何が変わったかで、重い job を出し分ける。**
  # 実測 2026-09-19: Actions の 2,000 分/月を使い切った。1 PR = 約 52 分（課金は
  # Linux 1x / Windows 2x）で、内訳は android-instrumented 22 / collector-windows-runtime 12 /
  # e2e 4.5 / rust 4 / android 4 / smoke 3 / web・collector-windows 2 / chain 0.2。
  # ST06 の PR #65 は `docs/` 7 件と `openspec/` 9 件だけでコードを 1 行も触っていないのに、
  # **9 job 全部が走った**。上流の PR は毎回これになる。
  #
  # 飛ばした job は `skipped` になり、run 全体の conclusion は success のままなので
  # `merge_gate.sh` の `gh run watch --exit-status` はそのまま通る。
  # **比較できないときは全部走らせる**（黙って飛ばさない）。
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.f.outputs.code }}
      android: ${{ steps.f.outputs.android }}
      windows: ${{ steps.f.outputs.windows }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false }
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() { for k in code android windows; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base が引けないので全部走らせる（BASE='${BASE:-}'）"; all; exit 0
          fi
          files="$(git diff --name-only "$BASE" "$HEAD")"
          echo "--- 変わったもの ---"; printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1"; }
          # docs / openspec / *.md 以外が 1 つでもあれば「コード」
          if printf '%s\n' "$files" | grep -vE '^(docs/|openspec/)|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          has '^(collector-android/|tools/android)|^\.github/' && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          has '^(crates/|Cargo\.)|^\.github/' && echo "windows=true" >> "$GITHUB_OUTPUT" || echo "windows=false" >> "$GITHUB_OUTPUT"
          echo "--- 判定 ---"; cat "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # 稼働記録の振る舞いは日境界（AT TIME ZONE）・一意索引・書き換え禁止のトリガと、
    # **どれも DB の側にある**（ST02 design D14）。模擬した DB で確かめると
    # 0004 が実測で見つけた「3 手の迂回」の型の穴がそのまま残るので、本物を立てる。
    # **飛ばさない** —— テストは接続できなければ落ちる（crates/server/src/testdb.rs）。
    # DB は `services` でなく compose で立てる: 合言葉を job の中で乱数から作る（design D19）ので、
    # job 開始時に立つ `services` の env（`env` コンテキストが使えない）へは渡せない。
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - run: ./tools/ci-db-env.sh
      - run: docker compose up -d --wait db
      - run: ./tools/db-roles.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./tools/check-migrations.sh
      - run: ./tools/check-boundaries.sh
      - run: ./tools/check-openapi.sh
      # 拠点外へ書き出す部品を持たない（NFR-15 / design D14）。一覧は台本の中
      - run: ./tools/check-offsite.sh --self-test
      - run: ./tools/check-offsite.sh
      - run: ./tools/check-exposure.sh --self-test
      - run: ./tools/check-private.sh --self-test
      # 時刻サーバへの経路が端末にも PC にも無いこと（ST05 / FR-7）
      - run: ./tools/check-no-time-server.sh
      - run: ./tools/check-no-time-server.sh --self-test
  # C-02（Windows 収集）の**実機側**。ubuntu の runner には Windows が無いので、
  # `cargo test` は cfg(windows) の中身を 1 行もコンパイルしない ——
  # **書いたまま腐る**ので、windows 向けにクロスで型検査だけ通す（ST07 / design D20）。
  collector-windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: x86_64-pc-windows-gnu, components: clippy }
      # rusqlite の `bundled` は SQLite を C から組み立てる。クロス lint でも
      # Windows 向け C コンパイラが無ければビルドスクリプトで止まる（ST08 design D2）。
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      # **型だけでなく lint も当てる**（review/code.md B-5 / R34）。ubuntu の clippy は
      # cfg(windows) の中身をコンパイルしないので、作業場の lint が platform.rs に届かない
      - run: cargo clippy -p ashiato-collector-windows --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  # C-02 の**実行時テスト**（ST07 design D25 / 2026-09-14）。windows-latest は対話セッションで動くので、
  # テストが自分で窓（WinForms / Edge）を出し、本物の前景・入力・アドレスバーを読ませて記録を数える。
  # ubuntu の `cargo test` は cfg(windows) の中身を 1 行も走らせないので、**ここだけが platform.rs を実行する**。
  # windows の runner は無料枠を 2 倍で消費する（design D25 の反転条件）。
  collector-windows-runtime:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    # 相手役の窓が固まると既定の 360 分を 2 倍で数える（review/code-r2.md R7）
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # ST08 の履歴の実行時テストは Chrome と Firefox も飛ばさない（design D14）。runner に無ければ入れる
      - shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\Mozilla Firefox\firefox.exe")) { choco install firefox -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (-not ((Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe") -or (Test-Path "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"))) { choco install googlechrome -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      # 単体 86 本 + 実行時テスト。ST08 の Edge / Chrome / Firefox 履歴 3 本を含める。
      # 前景は 1 つしか無いので実行時テストは直列にする
      - run: cargo test -p ashiato-collector-windows --lib
      # **走った本数を確かめる**（review/code-r2.md R8）—— テストが丸ごと消えても `running 0 tests` で緑になる
      - shell: pwsh
        run: |
          $out = cargo test -p ashiato-collector-windows --test runtime_windows -- --test-threads=1 2>&1 | Tee-Object -Variable log | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -notmatch 'test result: ok\. (\d+) passed') { Write-Error "結果の行が無い"; exit 1 }
          if ([int]$Matches[1] -lt 10) { Write-Error "実行時テストが $($Matches[1]) 本しか走っていない（10 本のはず）"; exit 1 }

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24" }
      - run: npm ci
      # **ライセンス検査はここ**（ST02 の review/code.md の R8 / C2）。
      # rust job に置いていたときは `npm ci` が無く、`web/node_modules` が存在しないので
      # Node の節が「0 件を確認」で緑になり、**ローカルの緑と CI の緑が別物**だった。
      - run: ../tools/check-licenses.sh
      - run: npx tsc -b
      - run: npm run lint
      # 画面の振る舞い（3 段の対比・週の選択・操作対象の大きさ・確定と暫定）。
      # **足さないと ST02 の web のテストが CI で 1 本も走らない。**
      - run: npm run test
      - run: npm run build
  # 画面の e2e（製造準備 B の工具）。**人間が見る縦串と同じ tools/stack.sh を呼ぶ** ——
  # 分けると「e2e は緑なのに人間が見る画面は違う」が起きる。
  # STACK_RESET=1 で DB を作り直してから始めるので、seed が落ちたらここで止まる
  # （溜まった DB でごまかさない）。**視覚回帰は使わない**（playwright.config.ts の注記）。
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - run: ./tools/ci-db-env.sh   # 合言葉は job の中で乱数から作る（tools/stack.sh が役割まで作る）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24" }
      - run: cargo build --release -p ashiato-server --bin ashiato-server
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          CI: "true"
          STACK_RESET: "1"
          # SERVER_BIN / WEB_DIST は既定（リポジトリ直下からの target/release/... と web/dist）で
          # 合っている。tools/stack.sh はリポジトリ直下へ cd するので、web/ からの相対では渡さない
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report/, retention-days: 7 }
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: collector-android } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu ランナーには Android SDK が入っている。ローカルと同じ wrapper を使う。
      - run: ./gradlew :app:assembleDebug
      # 収集側の振る舞い（端末識別子・まとめ送り・部分失敗・ログに値を出さない）。
      # **実機なしで確かめられる範囲はここで止める** —— 実機の確認は完了の判定が持つ。
      - run: ./gradlew :app:testDebugUnitTest

  # 収集側の**計測テスト**（2026-09-14）。ubuntu の runner は KVM が使えるので、エミュレータを立てて
  # 本物の framework で前景サービス・権限の入口・HTTP を通す（`src/androidTest`）。
  # 実機を繋いだときも `./gradlew :app:connectedDebugAndroidTest` で同じものが走る。
  # `-Pashiato.baseUrl` は平文 HTTP を 127.0.0.1（端末の中のテスト用サーバ）へ許すためだけ。
  android-instrumented:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with: { distribution: temurin, java-version: "21" }
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # ST04 の `RetentionInstrumentedTest` が未送信を 1.9 GB 置く（2 GB に近い量でも収集が起動する）
          disk-size: 6000M
          working-directory: collector-android
          # **2 段に分ける。** 権限を拒否したときのテストは「未許可・未要求」から始める必要があるが、
          # 自分の権限を自分で外すと計測テストのプロセスが死ぬ（実測 2026-09-18: `Process crashed`）。
          # 状態を作るのはテストの外（`pm clear`）の仕事にする。印は @NeedsPristinePermissions。
          # 行継続（`\`）は使わない —— この action に渡すと `Task '\' not found` になる（実測 2026-09-18）。
          # `pm clear` は使わない —— 前のテストが残した前景サービスがあると `Failed` で rc=1 になる（実測）。
          # 要るのは**権限の状態だけ**なので `pm reset-permissions`（既定 = 未許可・フラグ無し）で足りる。
          # UsageVolumeInstrumentedTest は usage access とイベント生成を準備する tools/usage-volume.sh だけで走らせる。
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pashiato.baseUrl=http://127.0.0.1:18787 -Pandroid.testInstrumentationRunnerArguments.notAnnotation=dev.ashiato.collector.NeedsPristinePermissions -Pandroid.testInstrumentationRunnerArguments.notClass=dev.ashiato.collector.UsageVolumeInstrumentedTest
            adb shell am force-stop dev.ashiato.collector
            adb shell pm reset-permissions
            ./gradlew :app:connectedDebugAndroidTest -Pashiato.baseUrl=http://127.0.0.1:18787 -Pandroid.testInstrumentationRunnerArguments.annotation=dev.ashiato.collector.NeedsPristinePermissions
            adb shell pm reset-permissions

  smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - run: ./tools/ci-db-env.sh   # 合言葉は job の中で乱数から作る（tools/smoke.sh が役割まで作る）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # 縦串。A で決めたもの同士が噛み合うかを見るのはこの 1 本だけ。
      - run: ./tools/smoke.sh
      - run: ./tools/check-panic-log.sh
      # 「収集した」記録が書き換えられないことを、わざと UPDATE を投げて確かめる（FR-30）
      - run: ./tools/check-immutable.sh

  # 要件 → Story の鎖と、stories.json からの再生成との一致（scripts/check_chain.py）。
  # scripts/ は .harness2/scripts への symlink で、.harness2 は runner には無い。private なので token が要る:
  # fine-grained PAT（harness2 の Contents: read）を secrets.HARNESS2_TOKEN に置く。
  # **無ければ warning で素通りする** —— ローカルの scripts/merge_gate.sh が同じ検査を必ず走らせる。
  chain:
    runs-on: ubuntu-24.04
    # token は job の env に置かない（同じ job の check-*.sh など PR 側のスクリプトから見えるため）。
    # 有無の判定と checkout の 2 か所だけに渡す。
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      # 網の名前・私設 IP が入っていないこと。**何が変わっても必ず見る** ——
      # 漏れたのは code ではなく `docs/` と `openspec/` の文書だった（2026-09-19）。
      # この job は出し分けの対象外で 0.2 分なので、全 PR に掛けても費用にならない。
      - run: ./tools/check-private.sh
      # ログに私的データを出せる書き方が無いこと（製造準備 A-2。一度出たログは消せない）
      - run: ./tools/check-log-private.sh --self-test
      - run: ./tools/check-log-private.sh
      # DB の合言葉が配布物に字面で無いこと。(b) は DB を使うので、合言葉を乱数で作って立てる
      - run: ./tools/ci-db-env.sh
      - run: docker compose up -d --wait db
      - run: ./tools/check-db-secret.sh
      - id: harness2
        env: { HARNESS2_TOKEN: "${{ secrets.HARNESS2_TOKEN }}" }
        run: echo "available=$([ -n "$HARNESS2_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.harness2.outputs.available != 'true'
        run: echo "::warning::secrets.HARNESS2_TOKEN が無いので check_chain を飛ばす（merge_gate がローカルで見る）"
      - if: steps.harness2.outputs.available == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # persist-credentials: false で token を harness2/.git/config に残さない（後続の check_chain.py から読めないように）
        with: { repository: rai-256/harness2, token: "${{ secrets.HARNESS2_TOKEN }}", path: harness2, persist-credentials: false }
      - if: steps.harness2.outputs.available == 'true'
        run: |
          ln -sfn "$PWD/harness2" .harness2      # scripts → .harness2/scripts（checkout ごとのリンク。runner には無い）
          python3 scripts/check_chain.py .
